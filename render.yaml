# Blueprint do Render: descreve o serviço da API (ADR-0047).
# Os valores marcados com sync: false NÃO ficam no Git; o Render pede para você digitá-los.
services:
  - type: web
    name: cuidamed-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      # "Esqueci minha senha" por e-mail (ADR-0063). Sem as duas, o envio fica desligado.
      - key: EMAIL_BREVO_CHAVE
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
