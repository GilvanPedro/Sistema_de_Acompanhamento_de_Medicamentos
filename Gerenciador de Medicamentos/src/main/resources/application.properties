# API REST (adapter/in/web). O Render informa a porta pela variável PORT.
server.port=${PORT:8080}
spring.main.banner-mode=off
# Não devolve mensagens internas de erro nem stack traces ao cliente.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.default-property-inclusion=non_null
# Atrás do proxy do Render, o IP do cliente vem em X-Forwarded-For. Só é aceito quando o pedido chega de um proxy de
# rede privada (padrão do Tomcat), então quem chama direto não consegue fingir outro IP para escapar dos limites.
server.forward-headers-strategy=native

# Envio de imagem de banner pelo painel: até 1 MB por arquivo.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
